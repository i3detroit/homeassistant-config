- id: '1638201355599'
  alias: Notify that genie is plugged in again
  triggers:
  - entity_id:
    - sensor.genie_charger_state
    to:
    - Charging
    trigger: state
  conditions: []
  actions:
  - data:
      message: The Genie is plugged in again!
    action: notify.i3detroit
  - target:
      entity_id: automation.notify_that_genie_is_plugged_in_again
    action: automation.turn_off
    data:
      stop_actions: true
  mode: single
- id: '1638231960434'
  alias: Complain If Genie Unplugged
  description: ''
  triggers:
  - entity_id:
    - sensor.genie_charger_state
    to:
    - Unplugged
    for:
      hours: 24
      minutes: 0
      seconds: 0
    trigger: state
  - entity_id:
    - sensor.genie_charger_state
    to:
    - unavailable
    for:
      hours: 24
      minutes: 0
      seconds: 0
    trigger: state
  conditions: []
  actions:
  - data:
      message: Seriously, plug in the Genie. It's been 24 hours.
    action: notify.i3detroit
  - target:
      entity_id: automation.notify_that_genie_is_plugged_in_again
    data: {}
    action: automation.turn_on
  mode: single
