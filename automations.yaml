- id: '1638201213002'
  alias: Complain if genie not plugged in
  description: ''
  trigger:
  - platform: state
    entity_id:
    - sensor.genie_charge_state
    for:
      hours: 6
      minutes: 0
      seconds: 0
    to: unavailable
  - platform: state
    entity_id:
    - sensor.genie_charge_state
    to: not plugged in
    for:
      hours: 6
      minutes: 0
      seconds: 0
  condition: []
  action:
  - service: notify.i3detroit
    data:
      message: The genie has been unplugged for over 6 hours
  - service: automation.turn_on
    target:
      entity_id: automation.notify_that_genie_is_plugged_in_again
    data: {}
  mode: single
- id: '1638201355599'
  alias: Notify that genie is plugged in again
  trigger:
  - platform: state
    entity_id: sensor.genie_charge_state
    to: Plugged in
  - platform: state
    entity_id: sensor.genie_charge_state
    to: Charging
  condition: []
  action:
  - service: notify.i3detroit
    data:
      message: The genie is plugged in again
  - service: automation.turn_off
    target:
      entity_id: automation.notify_that_genie_is_plugged_in_again
  mode: single
- id: '1638231960434'
  alias: Complain more if genie not plugged in
  description: ''
  trigger:
  - platform: state
    entity_id: sensor.genie_charge_state
    to: Not plugged in
    for: '24:00:00'
  - platform: state
    entity_id:
    - sensor.genie_charge_state
    to: unavailable
    for:
      hours: 24
      minutes: 0
      seconds: 0
  condition: []
  action:
  - service: notify.i3detroit
    data:
      message: Seriously, plug in the genie. It's been 24 hours. @mkfink @abzman
  - service: automation.turn_on
    target:
      entity_id: automation.notify_that_genie_is_plugged_in_again
    data: {}
  mode: single
- id: '1649818626943'
  alias: Thermostat Reset A-Side NE
  description: ''
  trigger:
  - platform: numeric_state
    entity_id: climate.a_side_ne_shop_thermostat
    attribute: temperature
    above: '10'
    for:
      hours: 3
      minutes: 0
      seconds: 0
  condition: []
  action:
  - service: esphome.thermostat_a_ne_idle_reset
  mode: single
