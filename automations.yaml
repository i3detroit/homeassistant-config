- id: '1777580048451'
  alias: Laser Cutter Exhaust On
  description: ''
  triggers:
  - entity_id:
    - switch.cyclops_cyclops
    - switch.wolverine_wolverine
    to:
    - 'on'
    trigger: state
  conditions: []
  actions:
  - data: {}
    target:
      entity_id: switch.laser_exhaust_fan_fan
    action: switch.turn_on
  mode: single
- id: '1777580438678'
  alias: Laser Cutter Exhaust Off
  description: ''
  triggers:
  - entity_id:
    - switch.cyclops
    - switch.wolverine
    to: 'off'
    trigger: state
  conditions:
  - condition: and
    conditions:
    - condition: or
      conditions:
      - condition: state
        entity_id: switch.cyclops_cyclops
        state:
        - 'off'
      - condition: state
        entity_id: switch.cyclops_cyclops
        state:
        - unavailable
    - condition: or
      conditions:
      - condition: state
        entity_id: switch.wolverine_wolverine
        state:
        - 'off'
      - condition: state
        entity_id: switch.wolverine_wolverine
        state:
        - unavailable
  actions:
  - data: {}
    target:
      entity_id: switch.laser_exhaust_fan_fan
    action: switch.turn_off
  mode: single
