- id: '1735616484533'
  alias: Turn On Recycle Notification Light
  description: ''
  trigger:
  - platform: time
    at: '18:00:05'
  condition:
  - condition: time
    before: '19:00:00'
    weekday:
    - wed
    after: '17:00:00'
  action:
  - service: switch.turn_on
    data: {}
    target:
      entity_id: switch.recycle_notification_light
  mode: single
