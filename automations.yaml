- id: '1777580438678'
  alias: Laser Cutter Exhaust Off
  description: ''
  triggers:
  - entity_id:
    - switch.cyclops
    - switch.wolverine
    to: 'off'
    trigger: state
  conditions:
  - condition: and
    conditions:
