    # on_release:
    #   - homeassistant.service:
    #       service: "esphome.${target_name}_led_1_green"
    
  - name: "Lock"
    device_class: lock
    id: button_1
    platform: gpio
    pin:
      number: 12
      mode: INPUT_PULLUP
      inverted: true
