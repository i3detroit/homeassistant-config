# Uses a button box PCB
# Don't install LED resistors
# Sensors on first 2 inputs (don't use 5V pin on JST connector)

packages: 
  board: !include common/packages/board_d1_mini.yaml
  base_components: !include common/packages/esp_home_components.yaml

substitutions:
  device_name: "glass-door"
  pretty_name: "Glass Door"
