packages:
  package: !include common/sonoff_pow_r1.yaml
  
substitutions:
  device_name: "genie"
  pretty_name: "Genie"
  ui_name: "Relay"
  icon: "mdi:oil-lamp"
  restore_mode: ALWAYS_ON

text_sensor:
  - platform: template
    id: charge_state
    name: "Charger State"
    icon: "mdi:power-plug"
    lambda: |-
      if (!id(relay).state) {
        return {"Disabled"};
      } else if (isnan(id(power_draw).state)) {
        return {"Unplugged"};
      } else if (id(power_draw).state > 50) {
        return {"Charging"};
      } else {
        return {"Plugged In"};
      }
