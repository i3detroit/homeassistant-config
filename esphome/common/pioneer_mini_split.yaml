packages:
  board: !include packages/board_esp12e.yaml
  base_components: !include packages/esp_home_components.yaml

# Disable logging over UART (required)
logger:
  baud_rate: 0

switch:
  - platform: template
    name: Beeper
    icon: mdi:volume-source
    optimistic: true
    turn_on_action:
      midea_ac.beeper_on:
    turn_off_action:
      midea_ac.beeper_off:

status_led:
  pin:
    number: GPIO13
    inverted: yes

# UART settings for Midea dongle (required)
uart:
  tx_pin: 1         # hardware dependant
  rx_pin: 3         # hardware dependant
  baud_rate: 9600

# Main settings
climate:
  - platform: midea
    name: "${ui_name}"
    icon: "${icon}"
    autoconf: true
    beeper: false
    visual:
      min_temperature: 15       # Note these values are in C
      max_temperature: 30
      temperature_step: 1
    supported_modes:
      - FAN_ONLY
      - HEAT_COOL
      - COOL
      - HEAT
      - DRY
#    supported_swing_modes:      
#      - VERTICAL
#      - HORIZONTAL
#      - BOTH
