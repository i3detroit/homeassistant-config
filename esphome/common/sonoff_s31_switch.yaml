packages:
  board: !include packages/board_esp01_1m.yaml
  base_components: !include packages/esp_home_components.yaml

# Need to turn off the serial logger because we are using the serial
# connection for the power sensors.
logger:
  baud_rate: 0
  level: DEBUG

uart:
  rx_pin: RX
  baud_rate: 4800
  parity: EVEN

status_led:
  pin:
    number: 13
    inverted: True

binary_sensor:
  - name: "Button"
    platform: gpio
    pin:
      number: 0
      mode: INPUT_PULLUP
      inverted: True
    on_press:
      - switch.toggle: relay_1
  - platform: status
    name: "Status"

switch:
  - name: "${ui_name}"
    id: relay_1
    icon: "${icon}"
    platform: gpio
    pin:
      number: 12
      inverted: False
    restore_mode: RESTORE_DEFAULT_OFF

sensor:
  - platform: cse7766
    voltage:
      name: "Voltage"
      filters:
        - throttle_average: 60s
    current:
      name: "Current"
      filters:
        - throttle_average: 60s
    power:
      name: "Power Draw"
      filters:
        - throttle_average: 60s
