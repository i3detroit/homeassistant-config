# captive_portal:

# logging breaks sonoff basics magically
logger:
  level: INFO

ota:
  - platform: esphome
  - platform: web_server

web_server:
  port: 80

esphome:
  friendly_name: "${pretty_name}"

api:

packages:
  wifi: !include wifi.yaml
  wifi_signal: !include wifi_signal.yaml
  uptime: !include uptime.yaml

switch:
  - platform: restart
    name: "Restart"
