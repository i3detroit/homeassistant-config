packages:
  package: !include common/sonoff_s31_switch.yaml

substitutions:
  device_name: "anycubic-photon"
  pretty_name: "Anycubic Photon"
  ui_name: "Relay"
  icon: "mdi:power"

esphome:
  on_boot:
    then:
      - switch.turn_on: relay

text_sensor:
  - platform: template
    id: state
    name: "State"
    icon: "mdi:printer-3d"
    lambda: |-
      if (!id(relay).state) {
        return {"Disabled"};
      } else if (isnan(id(power_draw).state)) {
        return {"Unplugged"};
      } else if (id(power_draw).state > 35) {
        return {"Running"};
      } else if (id(power_draw).state > 5) {
        return {"Waiting"};
      } else {
        return {"Idle"};
      }
