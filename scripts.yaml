set_tool_crib_led_matrix_motd:
  sequence:
  - action: input_text.set_value
    metadata: {}
    target:
      entity_id: input_text.tool_crib_led_matrix_motd
    data:
      value: '{{ text }}'
  fields:
    text:
      selector:
        text:
          multiline: true
      name: Text
      required: true
  alias: Set Tool Crib LED Matrix MOTD
  description: ''
