traffic_light_green:
  alias: Traffic Light Green
  sequence:
  - data: {}
    target:
      entity_id:
      - light.traffic_light_red_light
      - light.traffic_light_yellow_light
    action: light.turn_off
  - data: {}
    target:
      entity_id: light.traffic_light_green_light
    action: light.turn_on
  mode: single
  icon: mdi:traffic-light
traffic_light_red:
  alias: Traffic Light Red
  sequence:
  - data: {}
    target:
      entity_id:
      - light.traffic_light_green_light
      - light.traffic_light_yellow_light
    action: light.turn_off
  - data: {}
    target:
      entity_id: light.traffic_light_red_light
    action: light.turn_on
  mode: single
  icon: mdi:traffic-light
traffic_light_yellow:
  alias: Traffic Light Yellow
  sequence:
  - data: {}
    target:
      entity_id:
      - light.traffic_light_green_light
      - light.traffic_light_red_light
    action: light.turn_off
  - data: {}
    target:
      entity_id: light.traffic_light_yellow_light
    action: light.turn_on
  mode: single
  icon: mdi:traffic-light
traffic_light_off:
  alias: Traffic Lights Off
  sequence:
  - data: {}
    action: light.turn_off
    target:
      device_id: 565ecb1faaa9fdaf6f4b0dbc6434655b
  mode: single
  icon: mdi:traffic-light
traffic_light_sequence:
  alias: Traffic Light Sequence
  sequence:
  - repeat:
      count: '32'
      sequence:
      - service: script.traffic_light_red
        data: {}
      - delay:
          hours: 0
          minutes: 2
          seconds: 58
          milliseconds: 0
      - service: script.1774154545938
        data: {}
      - delay:
          hours: 0
          minutes: 0
          seconds: 4
          milliseconds: 0
      - service: script.traffic_light_red_2
        data: {}
      - delay:
          hours: 0
          minutes: 1
          seconds: 58
          milliseconds: 0
  - service: script.1774154938809
    data: {}
  mode: single
restart_a_side_keypad:
  sequence:
  - action: switch.turn_off
    metadata: {}
    target:
      entity_id: switch.a_side_main_keypad_watchdog_watchdog
    data: {}
  - delay:
      hours: 0
      minutes: 0
      seconds: 2
      milliseconds: 0
  - action: switch.turn_on
    metadata: {}
    target:
      entity_id: switch.a_side_main_keypad_watchdog_watchdog
    data: {}
  alias: Restart A-Side Keypad
  description: ''
restart_b_side_keypad:
